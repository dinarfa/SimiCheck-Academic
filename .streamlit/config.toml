[server]
maxUploadSize = 15

[client]
showErrorDetails = "none"

[logger]
level = "warning"

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#334155"
font = "sans-serif"
baseRadius = "0.625rem"
borderColor = "#CBD5E1"
showWidgetBorder = true
redColor = "#B91C1C"
orangeColor = "#B45309"
greenColor = "#15803D"
